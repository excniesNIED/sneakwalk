buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

group = 'org.hxcn.excnies.sneakwalk'
version = '1.0.0'
archivesBaseName = 'sneakwalk-1.12.2'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'
compileJava.options.compilerArgs += ['-proc:none']

minecraft {
    version = '1.12.2-14.23.5.2768'
    runDir = 'run'
    mappings = 'stable_39'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

configurations {
    shade
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.7.11-SNAPSHOT'
    shade('org.spongepowered:mixin:0.7.11-SNAPSHOT') { transitive = false }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../common/src/main/java', '../legacy-common/src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', '../legacy-common/src/main/resources']
        }
    }
}

jar {
    manifest {
        attributes(
                'FMLCorePlugin': 'org.hxcn.excnies.sneakwalk.core.SneakWalkCore',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = 'EXCLUDE'
}

reobf {
    jar {
        mappingType = 'SEARGE'
    }
}

runClient {
    jvmArgs '-Dmixin.debug.verbose=true'
}
